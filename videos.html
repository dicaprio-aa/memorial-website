
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1729">
    <title>Video Memories of Akhila Reji</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/memorial-theme.css">
</head>
<body class="gallery-page video-gallery-page">

<header class="site-header">
    <a href="index.html" class="logo">Akhila Reji</a>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">Life Journey</a>
        <a href="gallery.html">Memories</a>
        <a href="videos.html" class="active">Video Memories</a>
        <a href="share.html">Share a Memory</a>
    </nav>
</header>

<main class="gallery-shell">
    <section class="gallery-heading">
        <span class="gallery-kicker">VIDEO MEMORIES</span>
        <h1>Memories Forever</h1>
        <p>Watch and remember Akhila Reji through these treasured videos.</p>
    </section>

    <section class="gallery-carousel" aria-label="Video memories carousel">
        <div class="carousel-stage" id="video-carousel-stage" aria-live="polite">
            <button class="carousel-card carousel-card--far-left" type="button" data-position="far-left" aria-label="Play video preview"></button>
            <button class="carousel-card carousel-card--left" type="button" data-position="left" aria-label="Play video preview"></button>
            <button class="carousel-card carousel-card--center" type="button" data-position="center" aria-label="Play video preview"></button>
            <button class="carousel-card carousel-card--right" type="button" data-position="right" aria-label="Play video preview"></button>
            <button class="carousel-card carousel-card--far-right" type="button" data-position="far-right" aria-label="Play video preview"></button>
        </div>
        <div class="carousel-controls">
            <button class="carousel-arrow" id="video-previous" type="button" aria-label="Previous video">←</button>
            <span class="carousel-count" id="video-count" aria-live="polite"></span>
            <button class="carousel-arrow" id="video-next" type="button" aria-label="Next video">→</button>
        </div>
    </section>

    <dialog class="lightbox gallery-lightbox video-lightbox" aria-label="Video memory player">
        <div class="lightbox-toolbar">
            <button class="lightbox-close" type="button" aria-label="Close video player">Close</button>
        </div>
        <div class="lightbox-stage">
            <button class="lightbox-previous" type="button" aria-label="Previous video">‹</button>
            <div class="lightbox-media">
                <video controls playsinline preload="metadata"></video>
                <p class="lightbox-video-error" role="status" hidden></p>
            </div>
            <button class="lightbox-next" type="button" aria-label="Next video">›</button>
        </div>
        <div class="lightbox-meta">
            <span class="lightbox-count" aria-live="polite"></span>
            <a class="lightbox-download" download>Download original</a>
        </div>
    </dialog>
</main>

<footer class="site-footer">
    In loving memory of Akhila Reji
</footer>

<script src="js/videos.js" defer></script>
<script src="js/script.js" defer></script>
</body>
</html>
